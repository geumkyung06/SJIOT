name: clicky_keyring
description: 딸깍 - Clicky Keyring Studio (체험존 키오스크 앱)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  uuid: ^4.4.0
  window_manager: ^0.4.3
  pdf: ^3.13.0
  printing: ^5.15.0


dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/certs/custom_root.pem
    # [디자인] 화면 하단 로고 푸터에 쓰는 이미지
    - assets/images/logo-sejong.png
    - assets/images/logo-iotcoss.png
    # [프린터] 영수증 인쇄용 한글 폰트 (receipt_printer_service.dart에서 사용)
    - assets/fonts/NotoSansKR-Regular.ttf
    - assets/fonts/NotoSansKR-Bold.ttf

  # [디자인] 시안(딸깍 Keyring Studio)과 동일한 글꼴.
  # 키오스크 PC에 어떤 한글 폰트가 깔려 있든 항상 같은 모양으로 보이도록
  # 앱에 직접 포함시킵니다. (코드 로직과는 무관한 디자인 리소스입니다.)
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.otf
          weight: 900
